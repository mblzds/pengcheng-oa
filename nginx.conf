# MasterLife V3.0 Nginx 反向代理配置

upstream masterlife-backend {
    server app:8080;
}

# ======================== HTTP -> HTTPS 跳转 ========================
# 域名访问统一走 HTTPS。IP / 未配置的 host 也允许走 80 直访以便排查（生产可改成
# 强制 301 跳转）。
server {
    listen 80;
    server_name www.jiashunpingtai.com jiashunpingtai.com;

    # 微信小程序 / Let's Encrypt http-01 校验文件需要走 80，不能 redirect
    location /.well-known/ {
        root /usr/share/nginx/html;
    }

    # 其它统统跳 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ======================== HTTPS (443) ========================
server {
    listen 443 ssl;
    http2 on;
    server_name www.jiashunpingtai.com jiashunpingtai.com;

    ssl_certificate     /etc/nginx/cert/www.jiashunpingtai.com.pem;
    ssl_certificate_key /etc/nginx/cert/www.jiashunpingtai.com.key;

    # 现代 TLS 配置（兼顾兼容性与安全）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://masterlife-backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://masterlife-backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # kkFileView 预览代理
    location /kkfileview/ {
        proxy_pass http://kkfileview:8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OnlyOffice Document Server 代理（可选）
    # 仅当用 `docker compose --profile optional up` 启动 onlyoffice 容器时启用。
    # 默认情况下 onlyoffice 容器不启动，nginx 启动时 DNS 解析不到上游会 crash。
    # 如需启用，把下面整段取消注释，并确保 onlyoffice 容器在跑。
    # location /onlyoffice/ {
    #     proxy_pass http://onlyoffice:443/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # WOPI 接口（供 OnlyOffice 回调）
    location /wopi/ {
        proxy_pass http://masterlife-backend/wopi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 文件访问代理
    location /api/files/ {
        proxy_pass http://masterlife-backend/api/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
