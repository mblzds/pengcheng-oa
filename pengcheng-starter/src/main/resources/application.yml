spring:
  application:
    name: MasterLife
  profiles:
    active: dev
  servlet:
    multipart:
      # 文件上传大小限制：覆盖 Spring 默认的 1MB（默认值在不同手机相机拍照场景下会触发
      # "Maximum upload size exceeded"——iPhone/华为高像素相机即便走小程序压缩后仍可能 3-8MB）。
      # nginx 侧 client_max_body_size = 100MB，这里取 20MB 平衡安全与体验。
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true

# Knife4j / OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  basic:
    enable: false
    username: admin
    password: admin

# 服务器配置
server:
  port: 8080

pengcheng:
  feature:
    alipay:
      enabled: false
    wechat:
      mp:
        enabled: false
      mini:
        enabled: false
      pay:
        enabled: false
  chat:
    # 单条消息内容（content）最大字节数，超长直接 400 拒（防止客户端构造超大消息撑爆 TEXT 列）
    content-max-bytes: 4096
    retention:
      # 私聊保留天数；超过的会被定时任务物理删除
      private-days: 365
      # 群聊保留天数（追溯需求更长）
      group-days: 1095
      # 单次定时任务一次循环最多删多少行；累计 100 批后停手，避免长事务
      cleanup-batch: 1000
  # 注：签到逆地理编码已搬到小程序前端（utils/geocode.js + BAIDU_MAP_AK），
  # 因为用户 AK 为「浏览器端」类型，后端直接调 Web 服务接口会被 240「APP 服务被禁用」拒绝。
  # 此处不再保留 pengcheng.baidu-map 配置。
